name: StopStride Python, SQL & Dashboard CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run QA, decision and dashboard integration tests
        run: pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify dashboard logic
        run: node --test dashboard/tests/logic.test.cjs

      - name: Validate JavaScript syntax
        run: |
          node --check dashboard/app.js
          node --check dashboard/logic.js

      - name: Verify reproducible dashboard data
        run: |
          python src/run_analytics_demo.py --db /tmp/commuteiq_ci_demo.sqlite
          python dashboard/build_data.py --db /tmp/commuteiq_ci_demo.sqlite --out /tmp/commuteiq_ci_data.json
