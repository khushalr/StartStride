name: Publish StopStride REAL TTC Analytics

# Source snapshot must come from actual TTC incident records, verified via SHA256.
# Publish only dashboard assets explicitly listed below, never demo CSV/JSON files.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "stopstride-real-data-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate REAL TTC provenance, reject simulated content
        run: |
          python - <<'PY'
          import json, pathlib
          path = pathlib.Path("dashboard/real_data.json")
          if not path.exists():
              raise SystemExit("Refusing to deploy: verified real TTC snapshot missing")
          obj = json.loads(path.read_text(encoding="utf-8"))
          m = obj.get("meta", {})
          assert m.get("origin") == "REAL", "Synthetic or unverified data"
          assert m.get("source") and m.get("source_sha256"), "Missing source provenance"
          assert obj.get("summary",{}).get("recorded_incidents", 0) > 100
          print("Deploying real, historical TTC records from",m["source"])
          PY
      - name: Publish strictly allowlisted assets; never publish demo fixture or raw rider data
        run: |
          mkdir -p site
          cp dashboard/index.html dashboard/styles.css dashboard/real_app.js dashboard/real_data.json site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
